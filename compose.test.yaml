name: delivery-tests
services:
  postgres:
    extends: {file: compose.yaml, service: postgres}
  redis:
    extends: {file: compose.yaml, service: redis}
  rabbitmq:
    extends: {file: compose.yaml, service: rabbitmq}
  mongo:
    extends: {file: compose.yaml, service: mongo}
  mongo-init:
    extends: {file: compose.yaml, service: mongo-init}
  qdrant:
    extends: {file: compose.yaml, service: qdrant}
  tests:
    build: {context: ., target: test}
    environment:
      SESSION_SECRET: isolated-test-session-secret-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://delivery:delivery@postgres:5432/delivery
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://delivery:delivery@rabbitmq:5672/
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      QDRANT_URL: http://qdrant:6333
      RUN_INTEGRATION: "1"
    command: [python, scripts/test_all.py]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
      qdrant: {condition: service_started}
volumes:
  postgres-data:
  redis-data:
  rabbit-data:
  mongo-data:
  qdrant-data:
