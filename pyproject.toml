[project]
name = "delivery-service"
version = "0.1.0"
description = "Asynchronous international parcel delivery service"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
    "redis>=5.2,<8", "aio-pika>=9.5,<10", "pymongo>=4.13,<5",
    "httpx>=0.28,<1", "itsdangerous>=2.2,<3", "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.20,<1", "prometheus-client>=0.21,<1",
    "langchain-core>=1,<2", "langchain-groq>=1,<2",
    "langchain-qdrant>=1,<2", "fastembed>=0.7,<1", "tzdata>=2025.1"
]


[tool.poetry]
packages = [{include = "delivery_service", from = "src"}]

[project.scripts]
delivery = "delivery_service.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires real infrastructure", "e2e: requires running application and browser"]

[tool.coverage.run]
source = ["delivery_service"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.bandit]
exclude_dirs = [".venv", "venv", ".git", ".mypy_cache", ".ruff_cache"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "radon (>=6.0.1,<7.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "pytest-playwright>=0.7,<1",
    "respx>=0.22,<1", "fakeredis[lua]>=2.28,<3", "aiosqlite>=0.21,<1"
]
